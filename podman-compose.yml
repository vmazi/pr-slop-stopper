version: "3.8"

networks:
  shared:
    name: shared_network
    external: true

services:
  pr-slop-stopper:
    build:
      context: .
      dockerfile: Containerfile
    container_name: pr-slop-stopper
    restart: unless-stopped
    networks:
      - shared
    # No host port binding needed - Caddy accesses via shared_network
    environment:
      - GITHUB_APP_ID=${GITHUB_APP_ID}
      - GITHUB_PRIVATE_KEY=${GITHUB_PRIVATE_KEY}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET}
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
