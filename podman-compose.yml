version: "3.8"

networks:
  shared:
    name: shared_network
    external: true

secrets:
  GITHUB_APP_ID:
    external: true
  GITHUB_PRIVATE_KEY:
    external: true
  GITHUB_WEBHOOK_SECRET:
    external: true

services:
  pr-slop-stopper:
    build:
      context: .
      dockerfile: Containerfile
    container_name: pr-slop-stopper
    restart: unless-stopped
    networks:
      - shared
    secrets:
      - source: GITHUB_APP_ID
        type: env
        target: GITHUB_APP_ID
      - source: GITHUB_PRIVATE_KEY
        type: env
        target: GITHUB_PRIVATE_KEY
      - source: GITHUB_WEBHOOK_SECRET
        type: env
        target: GITHUB_WEBHOOK_SECRET
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  stop-pr-slop-landing:
    image: stop-pr-slop-landing:latest
    container_name: stop-pr-slop-landing
    restart: unless-stopped
    networks:
      - shared
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7920"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
